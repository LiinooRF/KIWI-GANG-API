name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: compilar y correr los tests
        run: ./mvnw verify -B -ntp

      - name: subir el jar como artefacto
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: kiwiapi-jar
          path: target/*.jar

  # el deploy va aparte y solo corre cuando el cambio ya llego a staging
  # en los pull request no corre, asi no se despliega nada sin revisar
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bajar el jar que armo el job de arriba
        uses: actions/download-artifact@v4
        with:
          name: kiwiapi-jar
          path: target

      - name: subir el jar a la ec2 y desplegar
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # si todavia no estan los secrets no se cae, solo avisa
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "faltan los secrets EC2_HOST o EC2_KEY, no se despliega (ver el readme)"
            exit 0
          fi
          echo "$EC2_KEY" > llave.pem
          chmod 600 llave.pem
          scp -i llave.pem -o StrictHostKeyChecking=no target/*.jar ec2-user@$EC2_HOST:/home/ec2-user/kiwiapi.jar
          scp -i llave.pem -o StrictHostKeyChecking=no deploy/desplegar.sh ec2-user@$EC2_HOST:/home/ec2-user/desplegar.sh
          #si la maquina es nueva y no tiene docker, se instala sola
          ssh -i llave.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST "command -v docker >/dev/null || sudo dnf install -y docker; sudo systemctl enable --now docker; DB_PASSWORD='$DB_PASSWORD' JWT_SECRET='$JWT_SECRET' bash desplegar.sh"
          rm llave.pem
