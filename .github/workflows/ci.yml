name: CI

# pruebas en cada pr y push, y deploy a la ec2 cuando llega a staging
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: bajar el codigo
        uses: actions/checkout@v4

      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: compilar y correr los tests
        run: ./mvnw verify -B -ntp

  # el deploy no corre en los pr
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: bajar el codigo
        uses: actions/checkout@v4

      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: armar el jar
        run: ./mvnw package -B -ntp -DskipTests

      - name: subir el jar a la ec2 y desplegar
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "faltan los secrets de la ec2 (ver el readme)"
            exit 0
          fi
          echo "$EC2_KEY" > llave.pem
          chmod 600 llave.pem

          scp -i llave.pem -o StrictHostKeyChecking=no target/*.jar ec2-user@$EC2_HOST:/home/ec2-user/kiwiapi.jar
          scp -i llave.pem -o StrictHostKeyChecking=no deploy/desplegar.sh ec2-user@$EC2_HOST:/home/ec2-user/desplegar.sh
          ssh -i llave.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST "DB_PASSWORD='$DB_PASSWORD' JWT_SECRET='$JWT_SECRET' bash desplegar.sh"

          rm llave.pem
