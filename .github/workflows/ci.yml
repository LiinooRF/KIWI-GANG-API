name: CI

# este es el ci/cd del backend:
# - en cada pull request: compila y corre las pruebas
# - en cada push a staging: las pruebas y despues lo despliega a la ec2
# - tambien se puede lanzar a mano con el boton run workflow

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  # primero las pruebas: si algo falla aca, no se despliega nada
  build:
    runs-on: ubuntu-latest
    steps:
      - name: bajar el codigo
        uses: actions/checkout@v4

      # java 21, el que pide el pom
      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # verify compila y corre las pruebas
      - name: compilar y correr los tests
        run: ./mvnw verify -B -ntp

  # el deploy solo corre cuando el cambio ya llego a staging, nunca en los pr
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: bajar el codigo
        uses: actions/checkout@v4

      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # los tests ya corrieron en el job de arriba, aca solo se arma el jar
      - name: armar el jar
        run: ./mvnw package -B -ntp -DskipTests

      - name: subir el jar a la ec2 y desplegar
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # si todavia no estan los secrets no se cae, solo avisa
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "faltan los secrets de la ec2, no se despliega (ver el readme)"
            exit 0
          fi

          # la llave pem va en un archivo para que la usen scp y ssh
          echo "$EC2_KEY" > llave.pem
          chmod 600 llave.pem

          # se suben el jar y el script, y el script deja la api corriendo
          scp -i llave.pem -o StrictHostKeyChecking=no target/*.jar ec2-user@$EC2_HOST:/home/ec2-user/kiwiapi.jar
          scp -i llave.pem -o StrictHostKeyChecking=no deploy/desplegar.sh ec2-user@$EC2_HOST:/home/ec2-user/desplegar.sh
          ssh -i llave.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST "DB_PASSWORD='$DB_PASSWORD' JWT_SECRET='$JWT_SECRET' bash desplegar.sh"

          rm llave.pem
