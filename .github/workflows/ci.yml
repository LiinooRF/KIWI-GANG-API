name: CI

# este workflow solo revisa que el codigo compile y pasen las pruebas.
# el despliegue a aws se hace desde el repo KIWI-GANG, con el workflow deploy.yml

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # bajar el codigo
      - uses: actions/checkout@v4

      # java 21, el que pide el pom
      - name: instalar java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compila y corre las pruebas (verify hace las dos cosas)
      - name: compilar y correr los tests
        run: ./mvnw verify -B -ntp
