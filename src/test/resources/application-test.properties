# configuracion que se usa en los tests
# h2 vive en memoria, asi los tests no necesitan mysql levantado
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# create-drop crea las tablas al empezar y las borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop

# clave solo para los tests, no es la real
jwt.secreto=clave-de-prueba-para-los-tests-123456
