# este archivo es solo una guia y no se usa al correr la app
# la configuracion real esta en application.properties
# cada uno debe definir estas variables en su pc

# DB_USER es el usuario de tu mysql, por ejemplo root
# DB_PASSWORD es la clave de tu mysql

spring.datasource.url=jdbc:mysql://localhost:3306/kiwiexpress?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}