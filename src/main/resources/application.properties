spring.application.name=kiwiapi

# conexion a mysql
# createDatabaseIfNotExist crea la base si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/kiwiexpress?createDatabaseIfNotExist=true
# usuario y clave vienen de variables de entorno para no subirlos al repo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# update hace que hibernate cree y ajuste las tablas desde las entidades
spring.jpa.hibernate.ddl-auto=update
# muestra en la consola el sql que se ejecuta
spring.jpa.show-sql=true

# flyway apagado porque todavia no tenemos migraciones
spring.flyway.enabled=false